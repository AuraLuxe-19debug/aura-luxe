      --bg-card: #141414;

      --text-light: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-color: #262626;
      --whatsapp-green: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; padding-bottom: 80px; }
    h1, h2, h3, .brand-font { font-family: 'Cinzel', serif; letter-spacing: 1px; }

    .announcement-bar { background: linear-gradient(90deg, #b8860b, #d4af37, #b8860b); color: #000; text-align: center; font-size: 0.8rem; font-weight: 700; padding: 8px 10px; letter-spacing: 1px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }

    .search-box input:focus { border-color: var(--gold-primary); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .action-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
